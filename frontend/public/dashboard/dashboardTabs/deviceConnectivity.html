
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SMSYS - Device Connectivity</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="../dashboard.css" />
    <link rel="stylesheet" href="deviceConnectivityResponsive.css" />
  </head>

  <body data-active="devices" data-navset="dashboard">
    <div id="app">
      <h1 class="dash-title">Device Connectivity</h1>

      <!-- Connected Summary -->
      <section
        class="dcard stat g-green device-summary-card device-summary-connected"
        style="left:325px;top:160px;width:520px;height:135px"
      >
        <h3>Connected</h3>
        <div class="big" id="cConnected">—</div>
        <p>Smart Hardhat Connected: Online</p>

        <svg class="stat-ico" viewBox="0 0 24 24">
          <path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/>
        </svg>
      </section>

      <!-- Disconnected Summary -->
      <section
        class="dcard stat g-red device-summary-card device-summary-disconnected"
        style="left:900px;top:160px;width:520px;height:135px"
      >
        <h3>Disconnected</h3>
        <div class="big" id="cDisconnected">—</div>
        <p>Smart Hardhat Disconnected: Offline</p>

        <svg class="stat-ico" viewBox="0 0 24 24">
          <path d="M6 2h9l5 5v15H6zM8 12h9v2H8zm0 4h9v2H8z"/>
        </svg>
      </section>

      <!-- Device Connectivity Table -->
      <section
        class="dcard g-panel device-table-card"
        style="left:325px;top:325px;width:1095px;height:300px"
      >
        <h3>Device Connectivity Table</h3>

        <div class="tbl" id="devStatusTable">
          <p class="device-loading">Loading device connectivity...</p>
        </div>
      </section>

      <!-- Device Connectivity Trend -->
      <section
        class="dcard g-panel device-trend-card"
        style="left:325px;top:655px;width:1095px;height:337px"
      >
        <h3>Device Connectivity Trend</h3>

        <div class="trend-legend">
          <span class="pill n">Online</span>
          <span class="pill d">Offline</span>
        </div>

        <div class="trend" id="devTrend">
          <p class="device-loading">Loading connectivity trend...</p>
        </div>
      </section>
    </div>

    <!-- Shared Dashboard Layout -->
    <script type="module" src="js/dashboardLayout.js"></script>

    <!-- Existing Device Connectivity Logic -->
    <script src="../deviceConnectivity.js"></script>
  </body>
</html>
