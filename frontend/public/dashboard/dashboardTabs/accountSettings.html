
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SMSYS - Account Settings</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="../dashboard.css" />
    <link rel="stylesheet" href="accountSettingsResponsive.css" />
  </head>

  <body data-active="account" data-navset="dashboard">
    <div id="app">
      <h1 class="dash-title">Account Settings</h1>

      <section class="panel-card" aria-labelledby="account-title">
        <svg
          class="panel-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/>
        </svg>

        <h2 id="account-title">ACCOUNT SETTINGS</h2>

        <p class="panel-desc">Update your supervisor pin.</p>

        <form class="pin-form" action="#" method="post">
          <label for="current-pin">Current Pin</label>

          <div class="pin-field">
            <svg class="pin-icon-start" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a5 5 0 0 0-5 5v3H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V11a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9z"/>
            </svg>

            <input
              type="password"
              id="current-pin"
              name="current-pin"
              placeholder="Enter current pin"
              autocomplete="current-password"
              required
            />

            <svg class="pin-icon-end" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
            </svg>
          </div>

          <label for="new-pin">New Pin</label>

          <div class="pin-field">
            <svg class="pin-icon-start" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a5 5 0 0 0-5 5v3H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V11a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9z"/>
            </svg>

            <input
              type="password"
              id="new-pin"
              name="new-pin"
              placeholder="Enter new pin"
              autocomplete="new-password"
              required
            />

            <svg class="pin-icon-end" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
            </svg>
          </div>

          <label for="confirm-pin">Confirm New Pin</label>

          <div class="pin-field">
            <svg class="pin-icon-start" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2a5 5 0 0 0-5 5v3H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V11a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9z"/>
            </svg>

            <input
              type="password"
              id="confirm-pin"
              name="confirm-pin"
              placeholder="Confirm new pin"
              autocomplete="new-password"
              required
            />

            <svg class="pin-icon-end" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
            </svg>
          </div>

          <div class="pin-actions">
            <button class="btn btn-primary" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>
              </svg>
              CONFIRM
            </button>

            <a class="btn btn-outline" href="../dashboard.html">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/>
              </svg>
              CANCEL
            </a>
          </div>
        </form>
      </section>
    </div>

    <script type="module" src="js/dashboardLayout.js"></script>
    <script type="module" src="js/pages/accountSettings.js"></script>
  </body>
</html>
