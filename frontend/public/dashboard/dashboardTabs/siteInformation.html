
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SMSYS - Site Information</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="../dashboard.css" />
    <link rel="stylesheet" href="siteInformationResponsive.css" />
  </head>

  <body data-active="siteinfo" data-navset="dashboard">
    <div id="app">
      <h1 class="dash-title">Site Information</h1>

      <section
        class="dcard g-panel site-info-card"
        aria-labelledby="site-details-title"
      >
        <h3 id="site-details-title">Site Details</h3>

        <p class="site-info-loading">
          Loading site information...
        </p>
      </section>
    </div>

    <!-- Dashboard shared layout -->
    <script
      type="module"
      src="js/dashboardLayout.js"
    ></script>

    <!-- Site Information page functionality -->
    <script
      type="module"
      src="js/pages/siteInformation.js"
    ></script>
  </body>
</html>
